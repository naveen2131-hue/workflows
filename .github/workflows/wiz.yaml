name: Defectdojo - Wiz Integration

on:
  push:
    branches:
      - "**"

  # schedule:
  #   - cron: '0 8 * * *' 

      
jobs:
  wiz_issues:
    runs-on: ubuntu-latest

    steps:
      
      - name: checkout code
        uses: actions/checkout@v6

      - name: Get Access Token
        id: get_token
        run: |
          RESPONSE=$(curl -sS -X POST "${{ secrets.TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "audience=wiz-api" \
            --data-urlencode "client_id=${{ secrets.CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CLIENT_SECRET }}")
 
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      
      - name: Get Project UUID
        id: uuid
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.access_token }}
        run: |
          curl -sS -X POST "https://api.us10.app.wiz.io/graphql" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d '{
              "query": "query { projects(first: 100) { nodes { id name } } }"
            }' | jq '.data.projects.nodes[] | select(.name=="Glofox AWS")' > project_uuid.json

          echo "project_id=$(jq -r '.id' project_uuid.json)" >> $GITHUB_OUTPUT

      - name: Defectdojo Product ID
        id: get_product
        run: |
          PROD_ID=$(curl -s -H "Authorization: Token d0cfb7dc99b1f0cc53675c7839e06fb3288ccd04" \
          http://localhost:8080/api/v2/products/?name="XYZ" \
          | jq -r '.results[0].id')

          echo "PROD_ID"=$prod_id >> $GITHUB_ENV
          echo "Product ID: $PROD_ID" 

          if [[ "$PROD_ID" =~ ^[0-9]+$ ]]; then 
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Product Name
        if: ${{ steps.get_product.outputs.exists == 'false' }}
        run: |
          curl -X POST "http://localhost:8080/api/v2/products/" \
            -H "Authorization: Token d0cfb7dc99b1f0cc53675c7839e06fb3288ccd04" \
            -H "Content-Type: application/json" \
            -d '{
              "business_criticality": "very high",
              "platform": "web service",
              "lifecycle": "construction",
              "origin": "third party library",
              "tags": ["string"],
              "name": "XYZ",
              "description": "XYZ",
              "internet_accessible": true,
              "enable_product_tag_inheritance": true,
              "enable_full_risk_acceptance": true,
              "disable_sla_breach_notifications": true,
              "prod_type": 1,
              "product_manager": 1,
              "technical_contact": 1,
              "team_manager": 1,
              "sla_configuration": 1,
              "regulations": [1]
            }'

      - name: Query Wiz Issues 
        env:
          ACCESS_TOKEN: ${{ steps.get_token.outputs.access_token }}
          PROJECT_ID: ${{ steps.uuid.outputs.project_id }}
          WIZ_API_URL: ${{ secrets.WIZ_API_URL }}
        run: |
      
          QUERY='
          query Issues($first: Int!, $after: String) {
            issues(first: $first, after: $after
              filterBy: {
                status: [OPEN, IN_PROGRESS]
                project: ["'"$PROJECT_ID"'"]
              }) {
              pageInfo {
                hasNextPage
                endCursor
              }
              nodes {
                id
                severity
                status
                type
                createdAt
                updatedAt
                resolvedAt
                reopenedAt
                statusChangedAt
                dueAt
                description
                resolutionReason
                resolutionNote
                url
                environments
                validatedAsExploitable
                hasCodeRemediation
                sourceRules {
                  id
                  name
                  description
                  risks
                  threats
                }
                entity {
                  id
                  name
                  type
                  providerUniqueId
                  properties
                  providerData
                  originalObject
                }
                projects {
                  name
                }
                serviceTickets {
                  id
                  externalId
                  name
                  url
                }
              }
            }
          }'
      
          echo '{"data":{"issues":{"nodes":[]}}}' > issues.json
      
          AFTER="null"
          HAS_NEXT="true"
      
          while [ "$HAS_NEXT" = "true" ]; do
      
            echo "Fetching next page..."
      
            JSON=$(jq -n \
              --arg query "$QUERY" \
              --argjson first 100 \
              --arg after "$AFTER" \
              '{
                query:$query,
                variables:{
                  first:$first,
                  after:(if $after == "null" then null else $after end)
                }
              }')
      
            curl -sS -X POST "$WIZ_API_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -d "$JSON" > page.json
      
            jq --slurpfile page page.json '
              .data.issues.nodes += ($page[0].data.issues.nodes // [])
            ' issues.json > merged.json
      
            mv merged.json issues.json
      
            HAS_NEXT=$(jq -r '.data.issues.pageInfo.hasNextPage // false' page.json)
            AFTER=$(jq -r '.data.issues.pageInfo.endCursor // "null"' page.json)
      
            echo "Has next page: $HAS_NEXT"
            echo "Next cursor: $AFTER"
      
          done

      - name: Convert JSON to CSV
        run: |

          jq -r '
          [
          "Created At","Title","Severity","Status","Description",
          "Resource Type","Project Names","Resolved Time","Resolution",
          "Resource Name","Resource Region","Resource Status",
          "Resource Platform","Resource OS","Issue ID","Ticket URLs",
          "Note","Due At","Remediation Recommendation","Subscription Name",
          "Wiz URL","Cloud Provider URL","Provider ID","Risks","Threats",
          "Status Changed At","Updated At","Reopened At"
          ],
          (.data.issues.nodes[]? |
          [
          .createdAt,
          .sourceRules[0]?.name,
          .severity,
          .status,
          .description,
          .entity?.type,
          (.projects? | map(.name) | join(";")),
          .resolvedAt,
          .resolutionReason,
          .entity?.name,
          .entity?.properties?.region,
          .entity?.properties?.status,
          .entity?.properties?.cloudPlatform,
          "",
          .id,
          (.serviceTickets // "" | tostring),
          .resolutionNote,
          .dueAt,
          .sourceRules[0]?.description,
          .entity?.properties?.subscriptionExternalId,
          .url,
          .entity?.properties?.cloudProviderURL,
          .entity?.providerUniqueId,
          (.sourceRules[0]?.risks // [] | join(";")),
          (.sourceRules[0]?.threats // [] | join(";")),
          .statusChangedAt,
          .updatedAt,
          .reopenedAt
          ])
          | @csv
          ' issues.json > wiz-issues.csv

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiz-issues
          path: wiz-issues.csv

      - name: Wiz reports Upload to DD
        run: |
          curl -X POST "http://localhost:8080/api/v2/reimport-scan/" \
            -H "Authorization: Token d0cfb7dc99b1f0cc53675c7839e06fb3288ccd04" \
            -H "Accept: application/json" \
            -H "Content-Type: multipart/form-data" \
            -F "scan_type=Wiz Scan" \
            -F "file=@wiz-issues.csv" \
            -F "engagement_name=test" \
            -F "active=true" \
            -F "verified=true" \
            -F "product_name=XYZ" \
            -F "minimum_severity=Low" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true"
